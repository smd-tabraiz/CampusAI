services:
  # -------------------------------------------------------------
  # 1. Backend Web Service (Node.js Express API)
  # -------------------------------------------------------------
  - type: web
    name: campusai-backend
    env: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install && npx prisma generate --schema=prisma/schema.postgres.prisma && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: campusai-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        fromService:
          type: web
          name: campusai-frontend
          property: host
      - key: IBM_API_KEY
        sync: false
      - key: IBM_PROJECT_ID
        sync: false
      - key: IBM_URL
        value: https://us-south.ml.cloud.ibm.com

  # -------------------------------------------------------------
  # 2. Frontend Static Site (React + Vite SPA)
  # -------------------------------------------------------------
  - type: web
    name: campusai-frontend
    env: static
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # Proxy /api requests to the backend service
      - type: rewrite
        source: /api/*
        destination: https://campusai-backend.onrender.com/api/*
      # SPA fallback routing
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: campusai-backend
          property: host

# -------------------------------------------------------------
# 3. Managed PostgreSQL Database
# -------------------------------------------------------------
databases:
  - name: campusai-postgres
    plan: free
    region: oregon
    databaseName: campusai_db
    user: campusai_user
