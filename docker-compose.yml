version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: campusai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: campusai_user
      POSTGRES_PASSWORD: campusai_secure_password_2026
      POSTGRES_DB: campusai_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusai_user -d campusai_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campusai-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: "postgresql://campusai_user:campusai_secure_password_2026@postgres:5432/campusai_db?schema=public"
      JWT_SECRET: "campusai_super_secret_jwt_key_2026_production_grade"
      JWT_EXPIRES_IN: "7d"
      CORS_ORIGIN: "http://localhost"
      IBM_API_KEY: "${IBM_API_KEY:-}"
      IBM_PROJECT_ID: "${IBM_PROJECT_ID:-}"
      IBM_URL: "${IBM_URL:-https://us-south.ml.cloud.ibm.com}"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: campusai-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
    driver: local
